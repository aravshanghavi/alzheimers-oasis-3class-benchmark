experiment: exp04_multislice_25d
description: >
  Optional 2.5D arm. Slices i-1, i, i+1 are packed into the three input channels
  instead of a replicated grayscale slice. Same architecture, same input shape.
  Converts the 2D-vs-3D limitation into a result (Reviewer 1 #3, Reviewer 3 #1).
data:
  context_slices: 3
sweep:
  losses: ["FA_FL"]
  folds:  [0, 1, 2, 3, 4]
  init_seeds: [42]
split:
  strategy: "grouped_kfold"
  group_by: "participant"
  n_splits: 5
  split_seed: 42
