experiment: exp08_focal_gamma200
description: >
  FAIRNESS CONTROL for the focal baseline.

  The exp01 focal arm runs at gamma = 3.0. The canonical value in Lin et al.
  (2017) is 2.0. A reviewer can reasonably object that the proposed method had
  two tuned parameters while the closest baseline was set to a non-canonical
  single value, and that the comparison is therefore not like for like.

  This arm runs focal at gamma = 2.0, everything else identical, so the
  manuscript can report the baseline at its canonical setting and remove that
  objection entirely.
loss:
  params:
    FocalLoss: {gamma: 2.0}
sweep:
  losses: ["FocalLoss"]
  folds:  [0, 1, 2, 3, 4]
  init_seeds: [42]
split:
  strategy: "grouped_kfold"
  group_by: "participant"
  n_splits: 5
  split_seed: 42
